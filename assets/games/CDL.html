<div class="stage" id="stage"><canvas id="c"></canvas></div>
<script>(function(){

var TAU=Math.PI*2;

}
function resize(){

}
addEventListener('resize',resize);

var N=22,SEG=8.5,IA=7,L1=11.2,L2=10.2,MAXV=78,TS=13;
var WIDTH=[8.0,7.7,8.8,10.9,13.2,14.4,14.8,14.8,14.6,14.4,14.0,13.2,11.6,9.9,8.4,7.2,6.0,5.0,4.0,3.0,2.1,1.3];
var ZC=[3.3,3.2,3.5,3.9,4.3,4.6,4.8,4.8,4.8,4.8,4.9,5.0,4.9,4.5,4.0,3.4,2.9,2.4,2.0,1.6,1.3,1.1];
var WP=[0.2,0.6,0.9,1.0,1.0,0.7,0.35,0,-0.35,-0.65,-0.9,-1.0,-0.95,-1.0,-1.1,-1.2,-1.3,-1.4,-1.5,-1.6,-1.7,-1.8];

var J=[],A=[],DJ=[],DA=[],AR=[],PA=[],TV=[],i0;
for(i0=0;i0<N;i0++){J.push({x:0,y:0});A.push(0);DJ.push({x:0,y:0});DA.push(0);AR.push(0);PA.push(0);TV.push(0);}
var heading=0,th=0,neck=0,turnDir=0,bodyArr=false,angVel=0,speed=0,phi=0,idle=0,breath=0,bph=0,gaze=0,droop=0,shake=0,headYaw=0,headNext=3,headTgt=0,boost=0,blinkT=-1,blinkNext=2,
    gaitOn=false,wa=0,BETA=0.34,kk=0,dlt=0.25,fidNext=3,bu=-0.8,hu=0,tl=0.1,flick=0,flickNext=6,
    bobD=0,lungeCD=3,lungeT=0,lungeArm=false,lidB=0,yawnDur=3.2,yawnRate=2.4,baskK=0,stalk=0,gape=0,gT=0,gRate=6,gMax=0.85,snapT=-1,yawnT=-1,yawnNext=10,sniffT=-1;
var legs=[
  {j:4,side:-1,front:true,l1:10.5,l2:9.5,fwd:2,lat:26.5,off:0,pair:0},
  {j:4,side:1,front:true,l1:10.5,l2:9.5,fwd:2,lat:26.5,off:0.5,pair:1},
  {j:11,side:-1,front:false,l1:12,l2:11,fwd:-3,lat:27,off:0.5,pair:1},
  {j:11,side:1,front:false,l1:12,l2:11,fwd:-3,lat:27,off:0,pair:0}
];
for(i0=0;i0<legs.length;i0++){
  var lg0=legs[i0];
  lg0.x=0;lg0.y=0;lg0.z=0;lg0.fromX=0;lg0.fromY=0;lg0.tx=0;lg0.ty=0;lg0.t=0;lg0.dur=0.2;lg0.stepping=false;lg0.over=0;lg0.reachD=0;lg0.ph=0;lg0.fa=0;lg0.fa0=0;lg0.faT=0;lg0.lift=2.6;
  lg0.g={fx:1,fy:0,px:0,py:1,hx:0,hy:0,hz:0,ix:0,iy:0};
  lg0.vx=0;lg0.vy=0;lg0.vz=1;lg0.H={x:0,y:0,z:0};lg0.E={x:0,y:0,z:0};lg0.Wr={x:0,y:0,z:0};lg0.P={x:0,y:0,z:0};
}
var PARTNER=[3,2,1,0];
var FW=[1,0.8,0.6,0.42,0.27,0.15,0.06,0];
var TOEF=[-1.0,-0.5,0,0.5,1.0],TOEFL=[4.0,5.4,6.0,5.4,4.0],TOER=[-0.9,-0.3,0.3,0.9],TOERL=[4.4,5.6,5.6,4.4];

var keys={up:false,down:false,left:false,right:false};
var aim={x:0,y:0},lastInput=-1e9,used=false,hintA=1;
var wander={x:0,y:0,pause:0,has:false};
var ripples=[];
function setAim(e){
  var r=canvas.getBoundingClientRect();
  var p=unproject(clamp(e.clientX-r.left,40,W-40),clamp(e.clientY-r.top,40,H-40));
  aim.x=p.x;aim.y=p.y;lastInput=T;used=true;
}
stage.addEventListener('pointermove',function(e){setAim(e);});

function key(e,v){
  if(e.code==='ArrowUp'||e.code==='KeyW') keys.up=v;
  if(e.code==='ArrowDown'||e.code==='KeyS') keys.down=v;

addEventListener('keydown',function(e){key(e,true);if(e.code.indexOf('Arrow')===0)e.preventDefault();});
addEventListener('keyup',function(e){key(e,false);});
addEventListener('blur',function(){keys.up=keys.down=keys.left=keys.right=false;});

function stz(i){
  var f=i<13?1:Math.max(0,1-(i-12)*0.1);
  return HH[i]*0.97+clamp(bu-bobD+0.8,0,5)*0.9*f+(i>=TS?tl*Math.pow((i-TS+1)/9,1.5):0)+(i===0?hu*0.3:0);
}
function geo(l){
  var g=l.g,c=DJ[l.j],a=DA[l.j],wd=WIDTH[l.j];

  g.px=-Math.sin(a)*l.side;g.py=Math.cos(a)*l.side;
  g.hx=c.x+g.px*wd*0.9;g.hy=c.y+g.py*wd*0.9;g.hz=stz(l.j)-0.55*HH[l.j];

function footAngle(g){return Math.atan2(g.fy*0.8+g.py*0.3,g.fx*0.8+g.px*0.3);}
var DTL=0.016;
function solveLeg(l){
  var L1=l.l1,L2=l.l2,g=l.g,H=l.H,E=l.E,Wr=l.Wr,fz=l.z+1.5,
      dx=l.x-g.hx,dy=l.y-g.hy,dz=fz-g.hz,d=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.001,
      ux=dx/d,uy=dy/d,uz=dz/d,dc=clamp(d,Math.abs(L1-L2)+0.6,(L1+L2)*0.985),
      a=(L1*L1-L2*L2+dc*dc)/(2*dc),h=Math.sqrt(Math.max(0,L1*L1-a*a)),fb=l.front?-0.9:0.9,
      pxw=g.px*0.55+g.fx*fb,pyw=g.py*0.55+g.fy*fb,pzw=0.15,dot=pxw*ux+pyw*uy+pzw*uz,
      vx=pxw-ux*dot,vy=pyw-uy*dot,vz=pzw-uz*dot,vl=Math.sqrt(vx*vx+vy*vy+vz*vz)||1;
  if(vl>0.3){vx/=vl;vy/=vl;vz/=vl;var kq=1-Math.exp(-DTL*18);l.vx+=(vx-l.vx)*kq;l.vy+=(vy-l.vy)*kq;l.vz+=(vz-l.vz)*kq;}

  vx/=vl;vy/=vl;vz/=vl;
  H.x=g.hx;H.y=g.hy;H.z=g.hz;
  E.x=g.hx+ux*a+vx*h;E.y=g.hy+uy*a+vy*h;E.z=g.hz+uz*a+vz*h;

    var mx=E.x-l.ex,my=E.y-l.ey,mz=E.z-l.ez,mm=Math.sqrt(mx*mx+my*my+mz*mz),lim=420*Math.min(DTL,0.035)+0.5;
    if(mm>lim){E.x=l.ex+mx/mm*lim;E.y=l.ey+my/mm*lim;E.z=l.ez+mz/mm*lim;}
  }

  for(var it=0;it<3;it++){
    var d1x=E.x-g.hx,d1y=E.y-g.hy,d1z=E.z-g.hz,n1=Math.sqrt(d1x*d1x+d1y*d1y+d1z*d1z)||1;
    E.x=g.hx+d1x*L1/n1;E.y=g.hy+d1y*L1/n1;E.z=g.hz+d1z*L1/n1;
    var d2x=E.x-Wr.x,d2y=E.y-Wr.y,d2z=E.z-Wr.z,n2=Math.sqrt(d2x*d2x+d2y*d2y+d2z*d2z)||1;
    E.x=Wr.x+d2x*L2/n2;E.y=Wr.y+d2y*L2/n2;E.z=Wr.z+d2z*L2/n2;
  }
  l.ex=E.x;l.ey=E.y;l.ez=E.z;l.hasE=true;
  Wr.x=g.hx+ux*dc;Wr.y=g.hy+uy*dc;Wr.z=g.hz+uz*dc;
}
function startStep(l,dur,tx,ty){
  var gg=l.g,lt=(tx-gg.hx)*gg.px+(ty-gg.hy)*gg.py;
  if(lt<9){tx+=gg.px*(9-lt);ty+=gg.py*(9-lt);}

}
function wvo(i,ph){var lg=0.09*(i-IA)+(i>=TS?(i-TS+1)*0.35:0);return wa*WP[i]*Math.sin(ph-lg);}
var RPX=0,RPY=0,RVX=1,RVY=0,GFR=1.1;
function restAt(l,tau){
  var j=l.j,th=AR[j]*tau,va=A[j]+th*0.5,wph=TAU*(((phi+GFR*tau)%1)-BETA*0.95)+Math.PI*0.5,i,a,
      cx=J[IA].x,cy=J[IA].y,cx0=J[IA].x,cy0=J[IA].y,wx,wy,wa2,ox,oy;
  if(j>IA){for(i=IA+1;i<=j;i++){a=A[i]+wvo(i,wph);cx-=Math.cos(a)*SEG;cy-=Math.sin(a)*SEG;cx0-=Math.cos(A[i])*SEG;cy0-=Math.sin(A[i])*SEG;}}
  else{for(i=IA;i>j;i--){a=A[i]+wvo(i,wph);cx+=Math.cos(a)*SEG;cy+=Math.sin(a)*SEG;cx0+=Math.cos(A[i])*SEG;cy0+=Math.sin(A[i])*SEG;}}
  wx=cx-cx0;wy=cy-cy0;
  wa2=A[j]+th+wvo(j,wph);
  ox=Math.cos(wa2)*l.fwd-Math.sin(wa2)*l.side*l.lat;oy=Math.sin(wa2)*l.fwd+Math.cos(wa2)*l.side*l.lat;
  RVX=Math.cos(va);RVY=Math.sin(va);
  var rr=AR[IA]*tau,hx0=cx0-J[IA].x,hy0=cy0-J[IA].y;
  RPX=J[j].x+Math.cos(va)*speed*tau+wx+ox+hx0*(Math.cos(rr)-1)-hy0*Math.sin(rr);
  RPY=J[j].y+Math.sin(va)*speed*tau+wy+oy+hx0*Math.sin(rr)+hy0*(Math.cos(rr)-1);
}

function init(){
  var c=unproject(W/2,H/2),i;
  heading=0;th=0;neck=0;turnDir=0;angVel=0;speed=0;phi=0;idle=0;gaitOn=false;wa=0;
  for(i=0;i<N;i++){J[i].x=c.x+N*SEG*0.4-i*SEG;J[i].y=c.y;A[i]=0;TV[i]=0;DJ[i].x=J[i].x;DJ[i].y=J[i].y;DA[i]=0;}
  for(i=0;i<legs.length;i++){
    geo(legs[i]);
    legs[i].x=legs[i].g.ix;legs[i].y=legs[i].g.iy;legs[i].z=0;legs[i].stepping=false;legs[i].fa=footAngle(legs[i].g);legs[i].ph=legs[i].off;
  }
  wander.has=false;prints.length=0;
  ready=true;
}
function pickWander(){
  var k,m=70;
  for(k=0;k<12;k++){
    var ang=heading+(Math.random()-0.5)*2.0,d=90+Math.random()*150,
        x=J[0].x+Math.cos(ang)*d,y=J[0].y+Math.sin(ang)*d,p=project(x,y,0);
    if(p.x>m&&p.x<W-m&&p.y>m&&p.y<H-m){wander.x=x;wander.y=y;return;}
  }
  var q=unproject(m+Math.random()*Math.max(1,W-2*m),m+Math.random()*Math.max(1,H-2*m));
  wander.x=q.x;wander.y=q.y;
}

function update(dt){
  T+=dt;DTL=dt;
  var head=J[0],tx,ty,cap,i,l,g,j;
  var dirx=(keys.right?1:0)-(keys.left?1:0),diry=(keys.down?1:0)-(keys.up?1:0);
  if(dirx||diry){
    var dl=Math.sqrt(dirx*dirx+diry*diry),cg=clampGround(head.x+dirx/dl*90,head.y+diry/dl*90,44);
    aim.x=cg.x;aim.y=cg.y;lastInput=T;used=true;
  }
  var dx,dy,dist;
  if(T-lastInput<6){
    tx=aim.x;ty=aim.y;wander.has=false;wander.pause=0;
    dx=tx-head.x;dy=ty-head.y;dist=Math.sqrt(dx*dx+dy*dy);
    cap=Math.min(MAXV,16+dist*0.26+Math.max(0,dist-160)*0.3);
    lungeCD-=dt;
    if(lungeT<=0&&lungeCD<=0&&dist>34&&dist<80&&speed>12&&Math.abs(wrap(Math.atan2(dy,dx)-heading))<0.5){lungeT=0.5;lungeArm=true;snapT=-1;yawnT=-1;lungeCD=9+Math.random()*7;}
    if(lungeT>0)cap=Math.max(cap,88);
  }else{
    if(!wander.has){pickWander();wander.has=true;wander.pause=0;}
    var wdx=wander.x-head.x,wdy=wander.y-head.y;
    if(Math.sqrt(wdx*wdx+wdy*wdy)<30){
      if(!wander.pause) wander.pause=T+2.5+Math.random()*5;
      else if(T>wander.pause){pickWander();wander.pause=0;}
    }
    tx=wander.x;ty=wander.y;cap=MAXV*0.4;
    dx=tx-head.x;dy=ty-head.y;dist=Math.sqrt(dx*dx+dy*dy);
  }

  var stopR=20,desired=0,wT=0,nT=0,df=0,rx0=J[IA].x,ry0=J[IA].y,dth,rdr,cs,sn,rxx,ryy,drT=Math.sqrt((tx-rx0)*(tx-rx0)+(ty-ry0)*(ty-ry0));
  bodyArr=bodyArr?(drT<SEG*IA-stopR+14):(drT<SEG*IA-stopR+3);
  if(dist>stopR&&!bodyArr){
    df=wrap(Math.atan2(dy,dx)-th);
    if(Math.abs(df)>2.6){if(!turnDir)turnDir=df>0?1:-1;df=turnDir*Math.abs(df);}else turnDir=0;
    var gv=1,mg,hrg;
    for(i=0;i<4;i++){l=legs[i];g=l.g;mg=(l.l1+l.l2)*0.985;hrg=Math.sqrt(Math.max(4,mg*mg-(g.hz-1.5)*(g.hz-1.5)));gv=Math.min(gv,clamp(((gaitOn?1.12:1.02)-l.reachD/hrg)/(gaitOn?0.15:0.2),gaitOn?0.6:0.2,1));}
    var wMax=(0.76-0.22*kk+0.3*boost)*gv;wT=clamp(df*2.2,-wMax,wMax);
    nT=clamp(df*0.55,-0.6,0.6);
    desired=Math.min(cap*(1+0.35*boost),(dist-stopR)*2.6)*(0.2*clamp((2.4-Math.abs(df))/1.2,0,1)+0.8*Math.max(0,Math.cos(df)))*(1+0.1*Math.sin(T*0.9)+0.05*Math.sin(T*2.3+1));

  speed+=(desired-speed)*(1-Math.exp(-dt*(desired<speed?4.5:(lungeT>0?8:(speed<20?3.4:2.4)))));

  kk=clamp(speed/MAXV,0,1);

  for(i=IA+1;i<N;i++){rxx=J[i].x-rx0;ryy=J[i].y-ry0;J[i].x=rx0+rxx*cs-ryy*sn;J[i].y=ry0+rxx*sn+ryy*cs;}
  J[IA].x+=Math.cos(th)*speed*dt;J[IA].y+=Math.sin(th)*speed*dt;
  for(i=IA;i>=1;i--){A[i]=th+neck*FW[i];J[i-1].x=J[i].x+Math.cos(A[i])*SEG;J[i-1].y=J[i].y+Math.sin(A[i])*SEG;}
  heading=th+neck;A[0]=heading;
  var cg2=clampGround(J[0].x,J[0].y,40);
  if(cg2.x!==J[0].x||cg2.y!==J[0].y){var sx=cg2.x-J[0].x,sy=cg2.y-J[0].y;for(i=0;i<N;i++){J[i].x+=sx;J[i].y+=sy;}}
  A[IA]=th;
  for(i=IA+1;i<N;i++){
    var p=J[i-1],c=J[i],a=Math.atan2(p.y-c.y,p.x-c.x),ref=A[i-1],maxB=0.10+0.08*(i/(N-1));
    a=ref+clamp(wrap(a-ref),-maxB,maxB);
    if(i>=TS){
      var kq=140-8*(i-TS),cq=2*0.42*Math.sqrt(kq),
          rest=ref+((idle>0.5?0.016:0.045)+0.03*boost+0.12*flick)*Math.sin(T*((idle>0.5?0.6:1.1)+1.2*boost+5*flick)-i*0.5)*((i-TS+1)/9);
      TV[i]+=(kq*wrap(rest-A[i])-cq*TV[i])*dt;
      a=A[i]+TV[i]*dt;
      a=ref+clamp(wrap(a-ref),-0.4,0.4);
    }
    A[i]=a;
    c.x=p.x-Math.cos(a)*SEG;c.y=p.y-Math.sin(a)*SEG;
  }
  for(i=0;i<N;i++){if(dt>0)AR[i]+=(wrap(A[i]-PA[i])/dt-AR[i])*(1-Math.exp(-dt*10));PA[i]=A[i];}

var LB=new Batch(320),LN=8,LNV=LN+1,LNR=7,
    LRX=new Float32Array(LNR*LNV),LRY=new Float32Array(LNR*LNV),LRZ=new Float32Array(LNR*LNV),LSX=new Float32Array(LNR*LNV),LSY=new Float32Array(LNR*LNV),
    LCX=new Float32Array(LNR),LCY=new Float32Array(LNR),LCZ=new Float32Array(LNR),LCV=new Float32Array(LNR*LN),LCI=new Uint8Array(LNR*LN),
    LPX=new Float32Array(LNR),LPY=new Float32Array(LNR),LPZ=new Float32Array(LNR),LAX=new Float32Array(LNR),LAY=new Float32Array(LNR),LAZ=new Float32Array(LNR),LRR=new Float32Array(LNR),
    legSeed=0;
function limbRing(k,px,py,pz,ux,uy,uz,r){
  var cx=-px,cy=CAMY-py,cz=CAMZ-pz,dd=cx*ux+cy*uy+cz*uz,w1x=cx-ux*dd,w1y=cy-uy*dd,w1z=cz-uz*dd,wl=Math.sqrt(w1x*w1x+w1y*w1y+w1z*w1z)||1,
      w2x,w2y,w2z,j,o,cc,ss,ph;

  w2x=uy*w1z-uz*w1y;w2y=uz*w1x-ux*w1z;w2z=ux*w1y-uy*w1x;
  LCX[k]=px;LCY[k]=py;LCZ[k]=pz;
  for(j=0;j<LNV;j++){
    ph=-Math.PI+TAU*j/LN;cc=Math.cos(ph)*r;ss=Math.sin(ph)*r;o=k*LNV+j;
    LRX[o]=px+cc*w1x+ss*w2x;LRY[o]=py+cc*w1y+ss*w2y;LRZ[o]=pz+cc*w1z+ss*w2z;

function legAlb(r,v){return 0.4+0.05*jt(r*5+legSeed,v+2);}
function legTubes(l){

  LPX[1]=H.x+ax*0.35;LPY[1]=H.y+ay*0.35;LPZ[1]=H.z+az*0.35;LRR[1]=fr?5.1:5.8;
  LPX[2]=H.x+ax*0.75;LPY[2]=H.y+ay*0.75;LPZ[2]=H.z+az*0.75;LRR[2]=fr?4.0:4.5;
  LPX[3]=E.x;LPY[3]=E.y;LPZ[3]=E.z;LRR[3]=fr?3.7:4.1;

  for(k=0;k<LNR;k++){

    limbRing(k,LPX[k],LPY[k],LPZ[k],ux*ul,uy*ul,uz*ul,LRR[k]);

var TXS=[0,0,0,0,0,0],TYS=[0,0,0,0,0,0],TZS=[0,0,0,0,0,0];
function legFoot(l){
  var P=l.P,k,nt=l.front?5:4,TA=l.front?TOEF:TOER,TL=l.front?TOEFL:TOERL,sc=1.22,curl=l.z*0.5,fan=1+0.3*clamp(l.z/2.6,0,1),
